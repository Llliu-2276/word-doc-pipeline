# profile：党政机关公文（GB/T 9704—2012）
#
# 取值来源：docs/document-type-specs.md 第 28 行（5 路检索汇总）与 GB/T 9704—2012 公开条文。
# 未逐条比对标准原文，仍标 verified = false；交付前请按发文机关的实施细则复核。
#
# 与默认 profile 的差异（本文件只覆盖差异项，其余继承 ug-thesis-bit）：
#   - 页边距 37/35/28/26 mm（版心 156×225 mm），左侧装订
#   - 正文 3 号仿宋_GB2312（16pt），22 行 × 28 字文档网格撑满版心
#   - 标题 2 号方正小标宋简体；层次 一、(黑体)（一）(楷体) 1./（1）(仿宋)
#   - 全线表，表内 4 号仿宋
#   - 页码 4 号宋体「— 1 —」，奇偶页外侧，无页眉

base = "ug-thesis-bit"
name = "cn-gov"
label = "党政机关公文（GB/T 9704-2012）"
standards = ["GB/T 9704-2012"]
references_standard = "2025"
verified = false
note = "页边距与版心、3 号仿宋、22 行×28 字网格、层次字体、全线表、外侧页码均据 GB/T 9704—2012；22 行×28 字的实际行高由文档网格决定（国标不给磅值）。"

